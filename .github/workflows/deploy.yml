name: Deploy to GitHub Pages

on:
  # main 分支有推送就自动发布
  push:
    branches: [main]
  # 也支持在 Actions 页面手动触发
  workflow_dispatch:

# 只允许一个发布任务同时进行
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 必须显式指定 Node 版本：Astro 7 要求 >= 22.12.0，
      # 而 withastro/action 默认用的 Node 20 会导致构建直接失败。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
